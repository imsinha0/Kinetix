defaults:
  - env: entity
  - learning:
    - ppo-base
    - ppo-rnn
  - misc: misc
  - model:
    - model-base
    - model-transformer
    - model-perm-invariant-mlp
  - _self_

env:
  # Stock Kinetix dense distance shaping (their default).
  dense_reward_scale: 0.2

misc:
  wandb_project: kinetix-rounds
  wandb_entity: imsinha-harvard-university
  save_path: null
  save_policy: false
  video_frequency: 10

# --- Environment size: the locomotion preset (kinetix/environment/ued/locomotion_distribution.py)
# env_size_type is neither "predefined" nor "custom" so the static params come from these keys.
env_size_name: locomotion
env_size_type: locomotion
num_polygons: 10
num_circles: 2
num_joints: 6
num_thrusters: 1
num_motor_bindings: 4
num_thruster_bindings: 2
frame_skip: 2
max_timesteps: null  # null = stock 256
eval_levels: []

# --- N-round continual protocol on disjoint task pools ---
num_rounds: 10
steps_per_round: 100000000
# Diversity axis: number of distinct locomotion levels in each round's pool.
# 1 = one fixed level per round; 256; 65536 (= 256^2, effectively a new level every episode).
tasks_per_round: 256
task_seed: 123
# kwargs for sample_locomotion_level (see its docstring); values below are the repo defaults.
# Override with dotted keys, e.g. locomotion_kwargs.num_random_legs_max=0 locomotion_kwargs.ued.floor_prob_red=0.0
locomotion_kwargs:
  num_random_legs_min: 1
  num_random_legs_max: 1
  add_ankles: true
  body_rotation_range: 0.0
  body_dimension_sampling_range_ratio: 0.5
  leg_dimension_sampling_range_ratio: 0.5
  ankle_dimension_sampling_range_ratio: 0.5
  ensure_leg_dims_equal: false
  ensure_ankle_dims_equal: false
  fix_goal_position: false
  # locomotion UEDParams overrides (floor colour probabilities; red = lava the body must not touch)
  ued:
    floor_prob_normal: 0.75
    floor_prob_green: 0.0
    floor_prob_blue: 0.0
    floor_prob_red: 0.25

# --- Eval: fixed episodes per pool; all pools evaluated every eval_freq updates and at boundaries ---
eval_freq: 16
eval_temperature: 0.0001
eval_num_episodes_periodic: 64
eval_num_episodes_full: 256
eval_num_video_episodes: 4
# GIFs (pool 1 + current pool) every N updates during each round, plus at every boundary.
video_freq_updates: 128

seed: 0

# --- Checkpoint/resume (preemptible partitions). null = checkpoints/rounds/<group>/<run>_s<seed>.
ckpt_dir: null
no_resume: false
